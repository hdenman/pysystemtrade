#YAML
# systems/hdenman/backtest/001_SP500/system.yaml
#
# Six-variant EWMAC system applied to SP500.
# No carry (no multiple-prices data loaded).
# Single instrument.

start_date: '1990-01-01'

# ---------------------------------------------------------------------------
# Trading rules
# ---------------------------------------------------------------------------

trading_rules:
  ewmac2_8:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 2
      Lslow: 8
    forecast_scalar: 10.6

  ewmac4_16:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 4
      Lslow: 16
    forecast_scalar: 7.5

  ewmac8_32:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 8
      Lslow: 32
    forecast_scalar: 5.3

  ewmac16_64:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 16
      Lslow: 64
    forecast_scalar: 3.75

  ewmac32_128:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 32
      Lslow: 128
    forecast_scalar: 2.65

  ewmac64_256:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 64
      Lslow: 256
    forecast_scalar: 1.87

forecast_cap: 20.0

# ---------------------------------------------------------------------------
# Forecast combination
# ---------------------------------------------------------------------------

forecast_weights:
  ewmac2_8:    0.167
  ewmac4_16:   0.167
  ewmac8_32:   0.167
  ewmac16_64:  0.167
  ewmac32_128: 10.166
  ewmac64_256: 10.166

forecast_div_multiplier: 1.1

# ---------------------------------------------------------------------------
# Capital
# ---------------------------------------------------------------------------

percentage_vol_target: 16.0
notional_trading_capital: 1000000
base_currency: "USD"

capital_multiplier:
  func: syscore.capital.half_compounding

# ---------------------------------------------------------------------------
# Portfolio
# ---------------------------------------------------------------------------

instrument_weights:
  SP500: 1.0

instrument_div_multiplier: 1.0
